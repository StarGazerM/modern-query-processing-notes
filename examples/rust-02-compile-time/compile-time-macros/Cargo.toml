[package]
name = "compile-time-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
syn_derive = { git = "https://github.com/StarGazerM/syn_derive", rev = "4782eed9cef0a79c5d0e6be2fa945b2fc5f30ede", default-features = false }
