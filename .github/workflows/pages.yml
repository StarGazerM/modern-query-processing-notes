name: Build and deploy course site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOTES_GITHUB_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check renderer
        run: |
          node --check render.mjs
          node --check build-site.mjs
          node --check check-site.mjs
          node --check check-examples.mjs

      - name: Build course site
        run: node build-site.mjs

      - name: Check published entry points
        run: |
          test -s build/index.html
          test -s build/syllabus.html
          test -s build/schedule.html
          test -s build/project.html
          test -s build/01-a-little-database-a-few-questions.html
          test -s build/aside-a-little-rust-side-by-side.html
          test -s build/rust-00-the-tree-we-could-read-twice.html
          test -s build/rust-01-the-code-that-became-a-value.html
          test -s build/rust-02-the-arithmetic-that-ran-before-the-program.html
          test -s build/rust-03-the-program-left-behind.html

      - name: Check internal links
        run: node check-site.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
