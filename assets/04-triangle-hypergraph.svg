<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title description">
  <title id="title">The on_triangle binary variable graph</title>
  <desc id="description">Three variable vertices a, b, and c form a triangle. Edge E1 joins a to b, E2 joins b to c, and E3 joins c to a. Variable a is marked as the head variable.</desc>
  <defs>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #22211f; }
      .note { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #666159; }
      .edge { fill: none; stroke-width: 8; stroke-linecap: round; }
      .variable { fill: #fffdf8; stroke: #22211f; stroke-width: 2.5; }
      .head { fill: none; stroke: #22211f; stroke-width: 2; }
      .variable-text { font: 650 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #22211f; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 750 16px ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: #f8f6ef; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
    </style>
  </defs>
  <rect width="680" height="520" rx="18" fill="#f8f6ef"/>
  <text x="40" y="48" class="heading">The closing edge creates a variable-graph cycle</text>
  <text x="40" y="78" class="note">Every labeled edge is one binary atom occurrence.</text>

  <line x1="195" y1="195" x2="485" y2="195" class="edge" stroke="#7c3aed"/>
  <line x1="485" y1="195" x2="340" y2="395" class="edge" stroke="#2563eb"/>
  <line x1="340" y1="395" x2="195" y2="195" class="edge" stroke="#dc2626"/>

  <text x="340" y="174" class="edge-label" fill="#7c3aed">E1</text>
  <text x="448" y="310" class="edge-label" fill="#2563eb">E2</text>
  <text x="232" y="310" class="edge-label" fill="#b91c1c">E3</text>

  <circle cx="195" cy="195" r="37" class="head"/>
  <circle cx="195" cy="195" r="30" class="variable"/><text x="195" y="195" class="variable-text">a</text>
  <circle cx="485" cy="195" r="30" class="variable"/><text x="485" y="195" class="variable-text">b</text>
  <circle cx="340" cy="395" r="30" class="variable"/><text x="340" y="395" class="variable-text">c</text>

  <text x="40" y="470" class="note">E1 = edge(a, b) · E2 = edge(b, c) · E3 = edge(c, a)</text>
  <text x="40" y="494" class="note">Double ring: head variable a.</text>
</svg>
