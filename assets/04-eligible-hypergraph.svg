<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title description">
  <title id="title">The eligible variable graph</title>
  <desc id="description">Four variable vertices named driver, depot, item, and job. Three labeled hyperedges D, S, and N form a path. Driver and job are marked as head variables.</desc>
  <defs>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #22211f; }
      .note { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #666159; }
      .edge { stroke-width: 3; }
      .variable { fill: #fffdf8; stroke: #22211f; stroke-width: 2.5; }
      .head { fill: none; stroke: #22211f; stroke-width: 2; }
      .variable-text { font: 650 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #22211f; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 750 16px ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: #f8f6ef; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="760" height="390" rx="18" fill="#f8f6ef"/>
  <text x="40" y="48" class="heading">The eligible variable graph</text>
  <text x="40" y="78" class="note">Shared vertices expose agreement; disjoint edges expose Cartesian product.</text>
  <rect x="80" y="150" width="245" height="92" rx="46" fill="#8b5cf6" fill-opacity="0.09" stroke="#7c3aed" class="edge"/>
  <rect x="260" y="150" width="240" height="92" rx="46" fill="#10b981" fill-opacity="0.09" stroke="#059669" class="edge"/>
  <rect x="435" y="150" width="245" height="92" rx="46" fill="#3b82f6" fill-opacity="0.08" stroke="#2563eb" class="edge"/>
  <text x="160" y="147" class="edge-label" fill="#7c3aed">D</text>
  <text x="375" y="147" class="edge-label" fill="#047857">S</text>
  <text x="602" y="147" class="edge-label" fill="#2563eb">N</text>
  <circle cx="125" cy="196" r="41" class="head"/><circle cx="125" cy="196" r="34" class="variable"/><text x="125" y="196" class="variable-text">driver</text>
  <circle cx="300" cy="196" r="34" class="variable"/><text x="300" y="196" class="variable-text">depot</text>
  <circle cx="465" cy="196" r="34" class="variable"/><text x="465" y="196" class="variable-text">item</text>
  <circle cx="635" cy="196" r="41" class="head"/><circle cx="635" cy="196" r="34" class="variable"/><text x="635" y="196" class="variable-text">job</text>
  <text x="40" y="316" class="note">D = based_at(driver, depot) · S = stocks(depot, item)</text>
  <text x="40" y="340" class="note">N = needs(job, item) · Double rings mark driver and job.</text>
</svg>
