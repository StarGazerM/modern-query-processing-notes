<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title description">
  <title id="title">The eligible binary variable graph</title>
  <desc id="description">Four variable vertices form a path. Edge D joins driver to depot, S joins depot to item, and N joins item to job. Driver and job are marked as head variables.</desc>
  <defs>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #22211f; }
      .note { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #666159; }
      .edge { fill: none; stroke-width: 8; stroke-linecap: round; }
      .variable { fill: #fffdf8; stroke: #22211f; stroke-width: 2.5; }
      .head { fill: none; stroke: #22211f; stroke-width: 2; }
      .variable-text { font: 650 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #22211f; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 750 16px ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: #f8f6ef; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
    </style>
  </defs>
  <rect width="760" height="390" rx="18" fill="#f8f6ef"/>
  <text x="40" y="48" class="heading">The eligible variable graph is a path</text>
  <text x="40" y="78" class="note">Meeting edges expose shared variables; separated edges expose a Cartesian first step.</text>

  <line x1="115" y1="195" x2="290" y2="195" class="edge" stroke="#7c3aed"/>
  <line x1="290" y1="195" x2="470" y2="195" class="edge" stroke="#059669"/>
  <line x1="470" y1="195" x2="645" y2="195" class="edge" stroke="#2563eb"/>

  <text x="202" y="174" class="edge-label" fill="#7c3aed">D</text>
  <text x="380" y="174" class="edge-label" fill="#047857">S</text>
  <text x="558" y="174" class="edge-label" fill="#2563eb">N</text>

  <circle cx="115" cy="195" r="42" class="head"/>
  <circle cx="115" cy="195" r="35" class="variable"/><text x="115" y="195" class="variable-text">driver</text>
  <circle cx="290" cy="195" r="35" class="variable"/><text x="290" y="195" class="variable-text">depot</text>
  <circle cx="470" cy="195" r="35" class="variable"/><text x="470" y="195" class="variable-text">item</text>
  <circle cx="645" cy="195" r="42" class="head"/>
  <circle cx="645" cy="195" r="35" class="variable"/><text x="645" y="195" class="variable-text">job</text>

  <text x="40" y="315" class="note">D = based_at(driver, depot) · S = stocks(depot, item)</text>
  <text x="40" y="339" class="note">N = needs(job, item) · Double rings mark driver and job.</text>
</svg>
