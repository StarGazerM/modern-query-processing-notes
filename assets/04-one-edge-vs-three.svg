<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">One ternary occurrence compared with three binary occurrences</title>
  <desc id="description">The left panel shows one region T containing variables a, b, and c for tri(a,b,c). The right panel shows three separate lines AB, BC, and CA connecting the same three variables for ab(a,b), bc(b,c), and ca(c,a). Variable a is marked as the head variable in both panels.</desc>
  <defs>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #22211f; }
      .panel-title { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #22211f; text-anchor: middle; }
      .note { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #666159; }
      .edge { fill: none; stroke-width: 7; stroke-linecap: round; }
      .variable { fill: #fffdf8; stroke: #22211f; stroke-width: 2.5; }
      .head { fill: none; stroke: #22211f; stroke-width: 2; }
      .variable-text { font: 650 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #22211f; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 750 15px ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: #f8f6ef; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
    </style>
  </defs>
  <rect width="920" height="500" rx="18" fill="#f8f6ef"/>
  <text x="40" y="48" class="heading">The same pairwise triangle can hide different atoms</text>
  <text x="40" y="78" class="note">Keeping each body occurrence separate distinguishes one ternary atom from three binary atoms.</text>

  <line x1="460" y1="110" x2="460" y2="425" stroke="#d6d3d1" stroke-width="2"/>
  <text x="240" y="126" class="panel-title">one ternary occurrence</text>
  <text x="680" y="126" class="panel-title">three binary occurrences</text>

  <path d="M95,175 Q240,125 385,175 L335,390 Q240,430 145,390 Z" fill="#8b5cf6" fill-opacity="0.10" stroke="#7c3aed" stroke-width="4"/>
  <text x="240" y="170" class="edge-label" fill="#7c3aed">T</text>

  <circle cx="145" cy="220" r="37" class="head"/><circle cx="145" cy="220" r="30" class="variable"/><text x="145" y="220" class="variable-text">a</text>
  <circle cx="335" cy="220" r="30" class="variable"/><text x="335" y="220" class="variable-text">b</text>
  <circle cx="240" cy="365" r="30" class="variable"/><text x="240" y="365" class="variable-text">c</text>
  <text x="240" y="458" class="note" text-anchor="middle">T = tri(a, b, c)</text>

  <line x1="585" y1="220" x2="775" y2="220" class="edge" stroke="#7c3aed"/>
  <line x1="775" y1="220" x2="680" y2="365" class="edge" stroke="#2563eb"/>
  <line x1="680" y1="365" x2="585" y2="220" class="edge" stroke="#dc2626"/>
  <text x="680" y="200" class="edge-label" fill="#7c3aed">AB</text>
  <text x="755" y="305" class="edge-label" fill="#2563eb">BC</text>
  <text x="605" y="305" class="edge-label" fill="#b91c1c">CA</text>

  <circle cx="585" cy="220" r="37" class="head"/><circle cx="585" cy="220" r="30" class="variable"/><text x="585" y="220" class="variable-text">a</text>
  <circle cx="775" cy="220" r="30" class="variable"/><text x="775" y="220" class="variable-text">b</text>
  <circle cx="680" cy="365" r="30" class="variable"/><text x="680" y="365" class="variable-text">c</text>
  <text x="680" y="448" class="note" text-anchor="middle">AB = ab(a,b) · BC = bc(b,c)</text>
  <text x="680" y="470" class="note" text-anchor="middle">CA = ca(c,a)</text>
</svg>
