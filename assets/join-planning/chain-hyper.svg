<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" role="img" aria-labelledby="title desc">
  <title id="title">The query answer(a,d) as a chain of three binary hyperedges</title>
  <desc id="desc">R contains a and b, S contains b and c, T contains c and d. R and T share no variable.</desc>
  <rect width="470" height="150" fill="#faf8f2"/>
  <path d="M 60 90 H 175" stroke="#8054b6" stroke-width="3"/>
  <path d="M 175 90 H 295" stroke="#27806c" stroke-width="3"/>
  <path d="M 295 90 H 410" stroke="#2765b0" stroke-width="3"/>
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g font-size="22" font-weight="650">
      <text x="118" y="49" fill="#8054b6">R</text>
      <text x="235" y="49" fill="#27806c">S</text>
      <text x="352" y="49" fill="#2765b0">T</text>
    </g>
    <g fill="#faf8f2" stroke="#292722" stroke-width="2.5">
      <circle cx="60" cy="90" r="28"/><circle cx="175" cy="90" r="28"/>
      <circle cx="295" cy="90" r="28"/><circle cx="410" cy="90" r="28"/>
    </g>
    <g font-size="22" font-weight="550" fill="#292722">
      <text x="60" y="97">a</text><text x="175" y="97">b</text>
      <text x="295" y="97">c</text><text x="410" y="97">d</text>
    </g>
  </g>
</svg>
