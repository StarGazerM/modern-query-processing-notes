<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-labelledby="title description">
  <title id="title">A branching binary variable graph</title>
  <desc id="description">Variable hub is the center of four labeled binary atom edges. R connects from to hub, T connects hub to to, O connects hub to day, and F connects hub to worker. From, to, day, and worker are marked as head variables.</desc>
  <defs>
    <style>
      .heading { font: 700 26px ui-sans-serif, system-ui, sans-serif; fill: #22211f; }
      .note { font: 500 14px ui-sans-serif, system-ui, sans-serif; fill: #666159; }
      .edge { fill: none; stroke-width: 8; stroke-linecap: round; }
      .variable { fill: #fffdf8; stroke: #22211f; stroke-width: 2.5; }
      .head { fill: none; stroke: #22211f; stroke-width: 2; }
      .variable-text { font: 650 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #22211f; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 750 16px ui-monospace, SFMono-Regular, Menlo, monospace; paint-order: stroke; stroke: #f8f6ef; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
    </style>
  </defs>
  <rect width="780" height="560" rx="18" fill="#f8f6ef"/>
  <text x="40" y="48" class="heading">A variable graph can branch without a loop</text>
  <text x="40" y="78" class="note">Four binary atom occurrences meet at hub; no route returns without retracing.</text>

  <line x1="390" y1="280" x2="145" y2="155" class="edge" stroke="#7c3aed"/>
  <line x1="390" y1="280" x2="635" y2="155" class="edge" stroke="#2563eb"/>
  <line x1="390" y1="280" x2="145" y2="420" class="edge" stroke="#059669"/>
  <line x1="390" y1="280" x2="635" y2="420" class="edge" stroke="#dc2626"/>

  <text x="260" y="205" class="edge-label" fill="#7c3aed">R</text>
  <text x="520" y="205" class="edge-label" fill="#2563eb">T</text>
  <text x="260" y="365" class="edge-label" fill="#047857">O</text>
  <text x="520" y="365" class="edge-label" fill="#b91c1c">F</text>

  <circle cx="145" cy="155" r="40" class="head"/>
  <circle cx="145" cy="155" r="33" class="variable"/><text x="145" y="155" class="variable-text">from</text>
  <circle cx="635" cy="155" r="40" class="head"/>
  <circle cx="635" cy="155" r="33" class="variable"/><text x="635" y="155" class="variable-text">to</text>
  <circle cx="390" cy="280" r="34" class="variable"/><text x="390" y="280" class="variable-text">hub</text>
  <circle cx="145" cy="420" r="40" class="head"/>
  <circle cx="145" cy="420" r="33" class="variable"/><text x="145" y="420" class="variable-text">day</text>
  <circle cx="635" cy="420" r="46" class="head"/>
  <circle cx="635" cy="420" r="39" class="variable"/><text x="635" y="420" class="variable-text">worker</text>

  <text x="40" y="500" class="note">R = road(from, hub) · T = rail(hub, to) · O = open(hub, day)</text>
  <text x="40" y="524" class="note">F = staffed(hub, worker) · Double rings mark all head variables.</text>
</svg>
